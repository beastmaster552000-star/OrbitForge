<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbitForge v0.5</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:system-ui,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#ui{
  position:fixed;
  z-index:10;
  left:12px;
  top:12px;
  width:calc(100% - 24px);
  max-width:390px;
  padding:15px;
  box-sizing:border-box;
  background:rgba(7,16,33,.9);
  border:1px solid #38507c;
  border-radius:18px;
  backdrop-filter:blur(8px);
}

h1{
  margin:0;
  letter-spacing:3px;
}

.sub{
  color:#9daaca;
  font-size:12px;
  margin:3px 0 15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border-radius:11px;
  border:1px solid #42577f;
  background:#315fcb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#091126;
  border:1px solid #22345b;
  font-size:14px;
}
</style>
</head>

<body>

<div id="ui">

<h1>ORBITFORGE</h1>

<div class="sub">
Planetary Simulation Laboratory · v0.5 TEST
</div>

<button id="start">▶ START</button>
<button id="reset">↻ RESET</button>

<div id="status">
Status: READY<br>
Planet X: 5 AU<br>
Simulation: PAUSED
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let planet;
let orbitLine;
let running=false;
let angle=0;

const start=document.getElementById("start");
const reset=document.getElementById("reset");
const status=document.getElementById("status");

function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x000005);

    camera=new THREE.PerspectiveCamera(
        60,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0,12,22);

    renderer=new THREE.WebGLRenderer({
        antialias:true,
        preserveDrawingBuffer:true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);

    // STAR

    const starGeometry=new THREE.SphereGeometry(2,48,48);

    const starMaterial=new THREE.MeshBasicMaterial({
        color:0xffcc33
    });

    const star=new THREE.Mesh(
        starGeometry,
        starMaterial
    );

    scene.add(star);

    // STAR LIGHT

    const light=new THREE.PointLight(
        0xffffff,
        3,
        100
    );

    scene.add(light);

    // PLANET

    const planetGeometry=new THREE.SphereGeometry(
        0.65,
        32,
        32
    );

    const planetMaterial=new THREE.MeshStandardMaterial({
        color:0x3388ff,
        roughness:.7
    });

    planet=new THREE.Mesh(
        planetGeometry,
        planetMaterial
    );

    scene.add(planet);

    // ORBIT

    const points=[];

    const radius=8;

    for(let i=0;i<=128;i++){

        const a=(i/128)*Math.PI*2;

        points.push(
            new THREE.Vector3(
                Math.cos(a)*radius,
                0,
                Math.sin(a)*radius
            )
        );

    }

    const orbitGeometry=
        new THREE.BufferGeometry().setFromPoints(points);

    const orbitMaterial=
        new THREE.LineBasicMaterial({
            color:0x3366ff
        });

    orbitLine=new THREE.LineLoop(
        orbitGeometry,
        orbitMaterial
    );

    scene.add(orbitLine);

    // STAR FIELD

    const starPositions=[];

    for(let i=0;i<1500;i++){

        starPositions.push(
            (Math.random()-.5)*200,
            (Math.random()-.5)*200,
            (Math.random()-.5)*200
        );

    }

    const starsGeometry=
        new THREE.BufferGeometry();

    starsGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            starPositions,
            3
        )
    );

    const starsMaterial=
        new THREE.PointsMaterial({
            color:0xffffff,
            size:.15
        });

    const stars=
        new THREE.Points(
            starsGeometry,
            starsMaterial
        );

    scene.add(stars);

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}

function animate(){

    requestAnimationFrame(animate);

    if(running){

        angle+=0.008;

    }

    const radius=8;

    planet.position.x=
        Math.cos(angle)*radius;

    planet.position.z=
        Math.sin(angle)*radius;

    planet.rotation.y+=0.02;

    renderer.render(
        scene,
        camera
    );
}

function resize(){

    camera.aspect=
        window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

start.addEventListener(
    "click",
    function(){

        running=!running;

        if(running){

            start.textContent="⏸ PAUSE";

            status.innerHTML=
                "Status: <b>RUNNING</b><br>"+
                "Planet X: 5 AU<br>"+
                "Simulation: ACTIVE";

        }else{

            start.textContent="▶ START";

            status.innerHTML=
                "Status: <b>PAUSED</b><br>"+
                "Planet X: 5 AU<br>"+
                "Simulation: PAUSED";

        }

    }
);

reset.addEventListener(
    "click",
    function(){

        running=false;
        angle=0;

        start.textContent="▶ START";

        status.innerHTML=
            "Status: <b>READY</b><br>"+
            "Planet X: 5 AU<br>"+
            "Simulation: RESET";

    }
);

init();

</script>

</body>
</html>
