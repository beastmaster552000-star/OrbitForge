<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitForge</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:#eef;font-family:system-ui}canvas{display:block}.p{position:fixed;top:14px;left:14px;width:290px;padding:16px;border:1px solid #293451;border-radius:16px;background:#070b15dd;backdrop-filter:blur(10px)}h1{margin:0;letter-spacing:3px}.sub{color:#93a1c0;font-size:12px;margin:3px 0 12px}button{padding:9px;border:1px solid #405070;border-radius:9px;background:#111a2d;color:white}.primary{background:#315fc8}.wide{width:100%}.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1}label{display:block;color:#aab6cf;font-size:12px;margin-top:10px}.v{float:right;color:white}input{width:100%}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;color:#aab6cf;font-size:12px;margin-top:12px}.stats b{color:white}.status{position:fixed;right:14px;top:14px;background:#070b15dd;border:1px solid #293451;border-radius:9px;padding:9px;color:#aab6cf;font-size:12px}</style></head><body>
<div id="app"></div><div class="p"><h1>ORBITFORGE</h1><div class="sub">3D Newtonian astronomy simulator · WEB v0.1</div>
<div class="row"><button id="run" class="primary">▶ START</button><button id="reset">↻ RESET</button></div>
<label>Time acceleration <span id="sv" class="v">100×</span></label><input id="speed" type="range" min="1" max="1000" value="100">
<label>Star radius <span id="rv" class="v">1 R☉</span></label><input id="rad" type="range" min="1" max="300" value="1">
<label>Star mass <span id="mv" class="v">1 M☉</span></label><input id="mass" type="range" min="1" max="20" step=".1" value="1">
<label>Planet X orbit <span id="dv" class="v">1 AU</span></label><input id="dist" type="range" min=".2" max="10" step=".1" value="1">
<div class="row"><button id="preset" class="wide">🌟 300 R☉ + 5 AU</button></div><button id="focus" class="wide">🎯 FOCUS PLANET X</button><div class="stats" id="stats"></div></div>
<div class="status" id="status">PAUSED · 3 bodies</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.170.0/build/three.module.js';
import {OrbitControls} from 'https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02040a);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.001,10000);cam.position.set(0,4,7);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.querySelector('#app').appendChild(ren.domElement);
const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;scene.add(new THREE.AmbientLight(0x667799,1.5));const light=new THREE.PointLight(0xffe8aa,100);scene.add(light);scene.add(new THREE.GridHelper(30,30,0x1b2842,0x09111e));
const G=4*Math.PI*Math.PI,b=[],running=false;let runState=false,t=0;
function add(name,m,x,y,v,r,c){let q=new THREE.Mesh(new THREE.SphereGeometry(r,28,18),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.08}));scene.add(q);b.push({name,m,x,y,vx:0,vy:v,mesh:q})}
function reset(){b.splice(0);scene.children.filter(o=>o.userData.orbit).forEach(o=>scene.remove(o));add('Star',1,0,0,0,.13,0xffc857);add('Planet X',3e-6,1,0,Math.sqrt(G),.055,0x6ea7ff);add('Outer World',9e-6,2.5,0,Math.sqrt(G/2.5),.065,0xaeb9c5);t=0;drawOrbits();stats()}
function drawOrbits(){scene.children.filter(o=>o.userData.orbit).forEach(o=>scene.remove(o));for(let i=1;i<b.length;i++){let p=b[i],pts=[];for(let k=0;k<257;k++){let a=k/256*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*Math.abs(p.x),0,Math.sin(a)*Math.abs(p.x)))}let l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x4167aa,transparent:true,opacity:.55}));l.userData.orbit=true;scene.add(l)}}
function step(dt){let ax=b.map(()=>[0,0]);for(let i=0;i<b.length;i++)for(let j=i+1;j<b.length;j++){let a=b[i],c=b[j],dx=c.x-a.x,dy=c.y-a.y,r2=dx*dx+dy*dy+1e-12,f=G/(r2*Math.sqrt(r2));ax[i][0]+=f*c.m*dx;ax[i][1]+=f*c.m*dy;ax[j][0]-=f*a.m*dx;ax[j][1]-=f*a.m*dy}b.forEach((x,i)=>{x.vx+=ax[i][0]*dt;x.vy+=ax[i][1]*dt;x.x+=x.vx*dt;x.y+=x.vy*dt;x.mesh.position.set(x.x,0,-x.y)});t+=dt}
function stats(){let x=b[1],d=Math.hypot(x.x,x.y),v=Math.hypot(x.vx,x.vy);document.querySelector('#stats').innerHTML='<div>Name</div><b>'+x.name+'</b><div>Distance</div><b>'+d.toFixed(3)+' AU</b><div>Speed</div><b>'+v.toFixed(3)+' AU/yr</b><div>Period</div><b>'+Math.pow(d,1.5).toFixed(3)+' yr</b><div>Time</div><b>'+t.toFixed(2)+' yr</b>'}
function apply(){let m=+mass.value,d=+dist.value,r=+rad.value;b[0].m=m;b[0].mesh.scale.setScalar(Math.cbrt(r));let p=b[1];p.x=d;p.y=0;p.vx=0;p.vy=Math.sqrt(G*m/d);rv.textContent=r+' R☉';mv.textContent=m+' M☉';dv.textContent=d.toFixed(1)+' AU';drawOrbits();stats()}
reset();
document.querySelector('#run').onclick=()=>{runState=!runState;run.textContent=runState?'⏸ PAUSE':'▶ START'};
document.querySelector('#reset').onclick=()=>{runState=false;run.textContent='▶ START';reset()};
document.querySelector('#preset').onclick=()=>{rad.value=300;dist.value=5;apply()};
document.querySelector('#focus').onclick=()=>{cam.position.set(b[1].x+2,2,-b[1].y+2);ctl.target.copy(b[1].mesh.position)};
['speed','rad','mass','dist'].forEach(id=>document.querySelector('#'+id).oninput=()=>{sv.textContent=speed.value+'×';apply()});
function loop(){requestAnimationFrame(loop);if(runState){let n=Math.min(250,Math.ceil(+speed.value/4));for(let i=0;i<n;i++)step(.002*(+speed.value/100));b.forEach(x=>x.mesh.position.set(x.x,0,-x.y));light.position.copy(b[0].mesh.position);stats();status.textContent='RUNNING · '+t.toFixed(2)+' yr · 3 bodies'}ctl.update();ren.render(scene,cam)}loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script></body></html>
