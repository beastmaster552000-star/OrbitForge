<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbitForge v0.8</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000005;
  color:white;
  font-family:system-ui,sans-serif;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  z-index:10;
  left:12px;
  top:12px;
  width:calc(100% - 24px);
  max-width:410px;
  max-height:calc(100vh - 24px);
  overflow-y:auto;
  padding:15px;
  box-sizing:border-box;
  background:rgba(7,16,33,.92);
  border:1px solid #38507c;
  border-radius:18px;
  backdrop-filter:blur(8px);
}

h1{
  margin:0;
  letter-spacing:3px;
}

.sub{
  color:#9daaca;
  font-size:12px;
  margin:3px 0 15px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:11px;
  border:1px solid #42577f;
  background:#315fcb;
  color:white;
  font-size:15px;
}

.control{
  margin-top:12px;
}

.control label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#c8d2e8;
}

.control input{
  width:100%;
  margin-top:6px;
}

.section{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #22345b;
  font-weight:bold;
  letter-spacing:1px;
}

#status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#091126;
  border:1px solid #22345b;
  font-size:12px;
  line-height:1.6;
}

.value{
  color:#8db5ff;
}

#hint{
  margin-top:12px;
  color:#7f8da8;
  font-size:11px;
  text-align:center;
}
</style>
</head>

<body>

<div id="ui">

<h1>ORBITFORGE</h1>

<div class="sub">
Planetary Simulation Laboratory · v0.8
</div>

<button id="start">▶ START</button>
<button id="reset">↻ RESET</button>
<button id="record">🎥 RECORD VIDEO</button>

<div id="status">
Status: <b>READY</b><br>
Simulation: PAUSED<br>
Time: 0 days<br>
Orbital Period: 11.18 years
</div>

<div class="section">
ORBITAL PARAMETERS
</div>

<div class="control">
<label>
<span>Star Mass</span>
<span class="value" id="starMassValue">1.00 M☉</span>
</label>

<input id="starMass"
type="range"
min="0.1"
max="5"
step="0.01"
value="1">
</div>

<div class="control">
<label>
<span>Semi-major Axis</span>
<span class="value" id="axisValue">5.00 AU</span>
</label>

<input id="axis"
type="range"
min="0.2"
max="20"
step="0.1"
value="5">
</div>

<div class="control">
<label>
<span>Eccentricity</span>
<span class="value" id="eccValue">0.000</span>
</label>

<input id="ecc"
type="range"
min="0"
max="0.9"
step="0.001"
value="0">
</div>

<div class="control">
<label>
<span>Inclination</span>
<span class="value" id="incValue">0°</span>
</label>

<input id="inc"
type="range"
min="0"
max="90"
step="1"
value="0">
</div>

<div class="control">
<label>
<span>Planet Mass</span>
<span class="value" id="planetMassValue">1 M⊕</span>
</label>

<input id="planetMass"
type="range"
min="0.1"
max="100"
step="0.1"
value="1">
</div>

<div class="section">
SIMULATION
</div>

<div class="control">
<label>
<span>Time Acceleration</span>
<span class="value" id="timeValue">30 days/s</span>
</label>

<input id="timeSpeed"
type="range"
min="1"
max="365"
step="1"
value="30">
</div>

<div class="control">
<label>
<span>Camera Distance</span>
<span class="value" id="cameraValue">24</span>
</label>

<input id="cameraDistance"
type="range"
min="10"
max="60"
step="1"
value="24">
</div>

<div class="control">
<label>
<span>Planet Size</span>
<span class="value" id="planetSizeValue">1×</span>
</label>

<input id="planetSize"
type="range"
min="0.5"
max="3"
step="0.1"
value="1">
</div>

<div id="hint">
Drag the scene to rotate the camera
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let star;
let planet;
let orbitLine;

let running=false;
let simulationDays=0;

let cameraAngle=0;
let cameraElevation=.55;

let mediaRecorder=null;
let recordedChunks=[];


/* CONTROLS */

const start=document.getElementById("start");
const reset=document.getElementById("reset");
const record=document.getElementById("record");

const status=document.getElementById("status");

const starMass=document.getElementById("starMass");
const axis=document.getElementById("axis");
const ecc=document.getElementById("ecc");
const inc=document.getElementById("inc");
const planetMass=document.getElementById("planetMass");

const timeSpeed=document.getElementById("timeSpeed");
const cameraDistance=document.getElementById("cameraDistance");
const planetSize=document.getElementById("planetSize");

const starMassValue=document.getElementById("starMassValue");
const axisValue=document.getElementById("axisValue");
const eccValue=document.getElementById("eccValue");
const incValue=document.getElementById("incValue");
const planetMassValue=document.getElementById("planetMassValue");

const timeValue=document.getElementById("timeValue");
const cameraValue=document.getElementById("cameraValue");
const planetSizeValue=document.getElementById("planetSizeValue");


/* SCALE */

const AU_SCALE=1.2;


/* INITIALIZATION */

function init(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x000005);


    camera=
        new THREE.PerspectiveCamera(
            55,
            window.innerWidth/window.innerHeight,
            .1,
            1000
        );


    renderer=
        new THREE.WebGLRenderer({
            antialias:true,
            preserveDrawingBuffer:true
        });


    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    /* STAR */

    const starGeometry=
        new THREE.SphereGeometry(
            2,
            48,
            48
        );


    const starMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffcc33
        });


    star=
        new THREE.Mesh(
            starGeometry,
            starMaterial
        );


    scene.add(star);


    const light=
        new THREE.PointLight(
            0xffffff,
            3,
            200
        );


    scene.add(light);


    /* PLANET */

    const planetGeometry=
        new THREE.SphereGeometry(
            .65,
            32,
            32
        );


    const planetMaterial=
        new THREE.MeshStandardMaterial({
            color:0x3388ff,
            roughness:.7
        });


    planet=
        new THREE.Mesh(
            planetGeometry,
            planetMaterial
        );


    scene.add(planet);


    createStarField();

    createOrbit();

    setupCameraControls();

    window.addEventListener(
        "resize",
        resize
    );


    updateValues();

    animate();
}


/* STAR FIELD */

function createStarField(){

    const positions=[];


    for(let i=0;i<1800;i++){

        positions.push(
            (Math.random()-.5)*250,
            (Math.random()-.5)*250,
            (Math.random()-.5)*250
        );

    }


    const geometry=
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    const material=
        new THREE.PointsMaterial({
            color:0xffffff,
            size:.14
        });


    scene.add(
        new THREE.Points(
            geometry,
            material
        )
    );
}


/* KEPLER EQUATION */

function solveKepler(M,e){

    let E=M;

    for(let i=0;i<12;i++){

        E=
            E-
            (E-e*Math.sin(E)-M)/
            (1-e*Math.cos(E));

    }

    return E;
}


/* ORBITAL PERIOD */

function getPeriodYears(){

    const a=
        Number(axis.value);

    const mass=
        Number(starMass.value);

    return Math.sqrt(
        (a*a*a)/mass
    );
}


/* CREATE ORBIT */

function createOrbit(){

    if(orbitLine){

        scene.remove(orbitLine);

    }


    const a=
        Number(axis.value);


    const e=
        Number(ecc.value);


    const b=
        a*Math.sqrt(1-e*e);


    const points=[];


    for(let i=0;i<=360;i++){

        const theta=
            (i/360)*Math.PI*2;


        const r=
            a*(1-e*e)/
            (1+e*Math.cos(theta));


        let x=
            r*Math.cos(theta);


        let z=
            r*Math.sin(theta);


        const inclination=
            THREE.MathUtils.degToRad(
                Number(inc.value)
            );


        const y=
            z*Math.sin(inclination);


        z=
            z*Math.cos(inclination);


        points.push(
            new THREE.Vector3(
                x*AU_SCALE,
                y*AU_SCALE,
                z*AU_SCALE
            )
        );

    }


    const geometry=
        new THREE.BufferGeometry()
        .setFromPoints(points);


    const material=
        new THREE.LineBasicMaterial({
            color:0x3366ff
        });


    orbitLine=
        new THREE.LineLoop(
            geometry,
            material
        );


    scene.add(orbitLine);
}


/* UPDATE PLANET POSITION */

function updatePlanet(){

    const a=
        Number(axis.value);

    const e=
        Number(ecc.value);

    const inclination=
        THREE.MathUtils.degToRad(
            Number(inc.value)
        );


    const periodYears=
        getPeriodYears();


    const periodDays=
        periodYears*365.25;


    let M=
        (
            simulationDays/
            periodDays
        )*
        Math.PI*2;


    M=
        M%(Math.PI*2);


    const E=
        solveKepler(M,e);


    const x=
        a*
        (Math.cos(E)-e);


    const z=
        a*
        Math.sqrt(1-e*e)*
        Math.sin(E);


    const y=
        z*Math.sin(inclination);


    const finalZ=
        z*Math.cos(inclination);


    planet.position.set(
        x*AU_SCALE,
        y*AU_SCALE,
        finalZ*AU_SCALE
    );
}


/* CAMERA */

function updateCamera(){

    const distance=
        Number(cameraDistance.value);


    const horizontal=
        distance*Math.cos(
            cameraElevation
        );


    camera.position.set(
        Math.sin(cameraAngle)*horizontal,
        distance*Math.sin(cameraElevation),
        Math.cos(cameraAngle)*horizontal
    );


    camera.lookAt(
        0,
        0,
        0
    );
}


/* CAMERA DRAG */

function setupCameraControls(){

    let dragging=false;

    let lastX=0;
    let lastY=0;


    renderer.domElement.addEventListener(
        "pointerdown",
        function(e){

            dragging=true;

            lastX=e.clientX;
            lastY=e.clientY;

            renderer.domElement.setPointerCapture(
                e.pointerId
            );

        }
    );


    renderer.domElement.addEventListener(
        "pointermove",
        function(e){

            if(!dragging)return;


            const dx=
                e.clientX-lastX;


            const dy=
                e.clientY-lastY;


            cameraAngle-=dx*.008;

            cameraElevation+=dy*.008;


            cameraElevation=
                Math.max(
                    .15,
                    Math.min(
                        1.35,
                        cameraElevation
                    )
                );


            lastX=e.clientX;
            lastY=e.clientY;

        }
    );


    renderer.domElement.addEventListener(
        "pointerup",
        function(){

            dragging=false;

        }
    );
}


/* ANIMATION */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(running){

        const daysPerSecond=
            Number(timeSpeed.value);


        simulationDays+=
            daysPerSecond/60;

    }


    updatePlanet();


    const size=
        Number(planetSize.value);


    planet.scale.set(
        size,
        size,
        size
    );


    star.rotation.y+=.001;


    updateCamera();


    renderer.render(
        scene,
        camera
    );


    updateStatus();
}


/* STATUS */

function updateStatus(){

    const years=
        getPeriodYears();


    status.innerHTML=
        "Status: <b>"+
        (running?"RUNNING":"PAUSED")+
        "</b><br>"+
        "Simulation: "+
        simulationDays.toFixed(1)+
        " days<br>"+
        "Orbital Period: "+
        years.toFixed(2)+
        " years<br>"+
        "Semi-major Axis: "+
        Number(axis.value).toFixed(2)+
        " AU<br>"+
        "Eccentricity: "+
        Number(ecc.value).toFixed(3);

}


/* UI VALUES */

function updateValues(){

    starMassValue.textContent=
        Number(starMass.value).toFixed(2)+
        " M☉";


    axisValue.textContent=
        Number(axis.value).toFixed(2)+
        " AU";


    eccValue.textContent=
        Number(ecc.value).toFixed(3);


    incValue.textContent=
        Number(inc.value)+
        "°";


    planetMassValue.textContent=
        Number(planetMass.value)+
        " M⊕";


    timeValue.textContent=
        Number(timeSpeed.value)+
        " days/s";


    cameraValue.textContent=
        cameraDistance.value;


    planetSizeValue.textContent=
        Number(planetSize.value).toFixed(1)+
        "×";


    createOrbit();

    updatePlanet();
}


/* PARAMETER EVENTS */

starMass.addEventListener(
    "input",
    updateValues
);


axis.addEventListener(
    "input",
    updateValues
);


ecc.addEventListener(
    "input",
    updateValues
);


inc.addEventListener(
    "input",
    updateValues
);


planetMass.addEventListener(
    "input",
    updateValues
);


timeSpeed.addEventListener(
    "input",
    updateValues
);


cameraDistance.addEventListener(
    "input",
    updateValues
);


planetSize.addEventListener(
    "input",
    updateValues
);


/* START */

start.addEventListener(
    "click",
    function(){

        running=!running;


        start.textContent=
            running?
            "⏸ PAUSE":
            "▶ START";

    }
);


/* RESET */

reset.addEventListener(
    "click",
    function(){

        running=false;

        simulationDays=0;

        cameraAngle=0;

        cameraElevation=.55;

        start.textContent=
            "▶ START";

        updatePlanet();

    }
);


/* VIDEO */

record.addEventListener(
    "click",
    function(){

        if(!window.MediaRecorder){

            alert(
                "Video recording is not supported."
            );

            return;

        }


        if(
            mediaRecorder &&
            mediaRecorder.state==="recording"
        ){

            mediaRecorder.stop();

            return;

        }


        recordedChunks=[];


        const stream=
            renderer.domElement
            .captureStream(60);


        let mimeType=
            "video/webm;codecs=vp9";


        if(
            !MediaRecorder.isTypeSupported(
                mimeType
            )
        ){

            mimeType="video/webm";

        }


        mediaRecorder=
            new MediaRecorder(
                stream,
                {mimeType:mimeType}
            );


        mediaRecorder.ondataavailable=
            function(e){

                if(e.data.size>0){

                    recordedChunks.push(
                        e.data
                    );

                }

            };


        mediaRecorder.onstop=
            function(){

                const blob=
                    new Blob(
                        recordedChunks,
                        {type:"video/webm"}
                    );


                const url=
                    URL.createObjectURL(
                        blob
                    );


                const a=
                    document.createElement(
                        "a"
                    );


                a.href=url;

                a.download=
                    "OrbitForge_v0.8.webm";


                document.body.appendChild(a);

                a.click();

                a.remove();


                URL.revokeObjectURL(url);


                record.textContent=
                    "🎥 RECORD VIDEO";

            };


        mediaRecorder.start();


        running=true;

        start.textContent=
            "⏸ PAUSE";


        record.textContent=
            "⏹ STOP RECORDING";

    }
);


init();

</script>

</body>
</html>
