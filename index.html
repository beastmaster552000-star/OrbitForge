<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbitForge v0.7</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000005;
  color:white;
  font-family:system-ui,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#ui{
  position:fixed;
  z-index:10;
  left:12px;
  top:12px;
  width:calc(100% - 24px);
  max-width:390px;
  max-height:calc(100vh - 24px);
  overflow-y:auto;
  padding:15px;
  box-sizing:border-box;
  background:rgba(7,16,33,.91);
  border:1px solid #38507c;
  border-radius:18px;
  backdrop-filter:blur(8px);
}

h1{
  margin:0;
  letter-spacing:3px;
}

.sub{
  color:#9daaca;
  font-size:12px;
  margin:3px 0 15px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:11px;
  border:1px solid #42577f;
  background:#315fcb;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#091126;
  border:1px solid #22345b;
  font-size:13px;
}

#controls{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #22345b;
}

.control{
  margin-top:12px;
}

.control label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#c8d2e8;
}

.control input{
  width:100%;
  margin-top:6px;
}

#hint{
  margin-top:12px;
  color:#7f8da8;
  font-size:11px;
  text-align:center;
}
</style>
</head>

<body>

<div id="ui">

<h1>ORBITFORGE</h1>

<div class="sub">
Planetary Simulation Laboratory · v0.7
</div>

<button id="start">▶ START</button>
<button id="reset">↻ RESET</button>
<button id="record">🎥 RECORD VIDEO</button>

<div id="status">
Status: <b>READY</b><br>
Planet X: 5 AU<br>
Simulation: PAUSED
</div>

<div id="controls">

<div class="control">
<label>
<span>Simulation Speed</span>
<span id="speedValue">1×</span>
</label>

<input id="speed"
type="range"
min="0.1"
max="5"
step="0.1"
value="1">
</div>

<div class="control">
<label>
<span>Camera Distance</span>
<span id="cameraValue">24</span>
</label>

<input id="cameraDistance"
type="range"
min="14"
max="50"
step="1"
value="24">
</div>

<div class="control">
<label>
<span>Planet Size</span>
<span id="planetValue">1×</span>
</label>

<input id="planetSize"
type="range"
min="0.5"
max="3"
step="0.1"
value="1">
</div>

</div>

<div id="hint">
Drag the scene to rotate the camera
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let planet;
let star;
let orbitLine;

let running=false;
let angle=0;

let mediaRecorder=null;
let recordedChunks=[];

let cameraAngle=0;
let cameraElevation=0.55;

const start=document.getElementById("start");
const reset=document.getElementById("reset");
const record=document.getElementById("record");

const status=document.getElementById("status");

const speed=document.getElementById("speed");
const speedValue=document.getElementById("speedValue");

const cameraDistance=document.getElementById("cameraDistance");
const cameraValue=document.getElementById("cameraValue");

const planetSize=document.getElementById("planetSize");
const planetValue=document.getElementById("planetValue");


function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x000005);


    camera=new THREE.PerspectiveCamera(
        55,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true,
        preserveDrawingBuffer:true
    });


    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    // SUN

    const starGeometry=
        new THREE.SphereGeometry(
            2,
            48,
            48
        );


    const starMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffcc33
        });


    star=new THREE.Mesh(
        starGeometry,
        starMaterial
    );


    scene.add(star);


    // SUN LIGHT

    const light=
        new THREE.PointLight(
            0xffffff,
            3,
            100
        );


    scene.add(light);


    // PLANET

    const planetGeometry=
        new THREE.SphereGeometry(
            0.65,
            32,
            32
        );


    const planetMaterial=
        new THREE.MeshStandardMaterial({
            color:0x3388ff,
            roughness:.7,
            metalness:.05
        });


    planet=new THREE.Mesh(
        planetGeometry,
        planetMaterial
    );


    scene.add(planet);


    // ORBIT

    const radius=6;

    const points=[];


    for(let i=0;i<=256;i++){

        const a=
            (i/256)*Math.PI*2;


        points.push(
            new THREE.Vector3(
                Math.cos(a)*radius,
                0,
                Math.sin(a)*radius
            )
        );

    }


    const orbitGeometry=
        new THREE.BufferGeometry()
        .setFromPoints(points);


    const orbitMaterial=
        new THREE.LineBasicMaterial({
            color:0x3366ff
        });


    orbitLine=
        new THREE.LineLoop(
            orbitGeometry,
            orbitMaterial
        );


    scene.add(orbitLine);


    // STAR FIELD

    const positions=[];


    for(let i=0;i<1800;i++){

        positions.push(
            (Math.random()-.5)*250,
            (Math.random()-.5)*250,
            (Math.random()-.5)*250
        );

    }


    const starFieldGeometry=
        new THREE.BufferGeometry();


    starFieldGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    const starFieldMaterial=
        new THREE.PointsMaterial({
            color:0xffffff,
            size:.14
        });


    const starField=
        new THREE.Points(
            starFieldGeometry,
            starFieldMaterial
        );


    scene.add(starField);


    window.addEventListener(
        "resize",
        resize
    );


    setupCameraControls();

    animate();
}


function updateCamera(){

    const distance=
        Number(cameraDistance.value);

    const horizontal=
        distance*Math.cos(cameraElevation);

    camera.position.set(
        Math.sin(cameraAngle)*horizontal,
        distance*Math.sin(cameraElevation),
        Math.cos(cameraAngle)*horizontal
    );

    camera.lookAt(
        0,
        0,
        0
    );
}


function setupCameraControls(){

    let dragging=false;
    let lastX=0;
    let lastY=0;


    renderer.domElement.addEventListener(
        "pointerdown",
        function(event){

            dragging=true;

            lastX=event.clientX;
            lastY=event.clientY;

            renderer.domElement.setPointerCapture(
                event.pointerId
            );

        }
    );


    renderer.domElement.addEventListener(
        "pointermove",
        function(event){

            if(!dragging)return;

            const dx=
                event.clientX-lastX;

            const dy=
                event.clientY-lastY;


            cameraAngle-=dx*0.008;

            cameraElevation+=dy*0.008;


            cameraElevation=
                Math.max(
                    0.15,
                    Math.min(
                        1.35,
                        cameraElevation
                    )
                );


            lastX=event.clientX;
            lastY=event.clientY;

        }
    );


    renderer.domElement.addEventListener(
        "pointerup",
        function(){

            dragging=false;

        }
    );

}


function animate(){

    requestAnimationFrame(
        animate
    );


    if(running){

        angle+=
            0.008*
            Number(speed.value);

    }


    const radius=6;


    planet.position.x=
        Math.cos(angle)*radius;


    planet.position.z=
        Math.sin(angle)*radius;


    planet.rotation.y+=0.02;


    const size=
        Number(planetSize.value);


    planet.scale.set(
        size,
        size,
        size
    );


    star.rotation.y+=0.001;


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* START / PAUSE */

start.addEventListener(
    "click",
    function(){

        running=!running;


        if(running){

            start.textContent=
                "⏸ PAUSE";


            status.innerHTML=
                "Status: <b>RUNNING</b><br>"+
                "Planet X: 5 AU<br>"+
                "Simulation: ACTIVE";

        }else{

            start.textContent=
                "▶ START";


            status.innerHTML=
                "Status: <b>PAUSED</b><br>"+
                "Planet X: 5 AU<br>"+
                "Simulation: PAUSED";

        }

    }
);


/* RESET */

reset.addEventListener(
    "click",
    function(){

        running=false;

        angle=0;

        cameraAngle=0;

        cameraElevation=0.55;

        speed.value=1;

        cameraDistance.value=24;

        planetSize.value=1;


        start.textContent=
            "▶ START";


        status.innerHTML=
            "Status: <b>READY</b><br>"+
            "Planet X: 5 AU<br>"+
            "Simulation: RESET";

        updateValues();

    }
);


/* SETTINGS */

function updateValues(){

    speedValue.textContent=
        Number(speed.value).toFixed(1)+"×";


    cameraValue.textContent=
        cameraDistance.value;


    planetValue.textContent=
        Number(planetSize.value).toFixed(1)+"×";

}


speed.addEventListener(
    "input",
    updateValues
);


cameraDistance.addEventListener(
    "input",
    updateValues
);


planetSize.addEventListener(
    "input",
    updateValues
);


/* VIDEO RECORDING */

record.addEventListener(
    "click",
    function(){

        if(!window.MediaRecorder){

            alert(
                "Video recording is not supported by this browser."
            );

            return;

        }


        if(
            mediaRecorder &&
            mediaRecorder.state==="recording"
        ){

            mediaRecorder.stop();

            return;

        }


        recordedChunks=[];


        const stream=
            renderer.domElement.captureStream(60);


        let mimeType=
            "video/webm;codecs=vp9";


        if(!MediaRecorder.isTypeSupported(mimeType)){

            mimeType=
                "video/webm";

        }


        mediaRecorder=
            new MediaRecorder(
                stream,
                {mimeType:mimeType}
            );


        mediaRecorder.ondataavailable=
            function(event){

                if(event.data.size>0){

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop=
            function(){

                const blob=
                    new Blob(
                        recordedChunks,
                        {type:"video/webm"}
                    );


                const url=
                    URL.createObjectURL(blob);


                const a=
                    document.createElement("a");


                a.href=url;

                a.download=
                    "OrbitForge_v0.7.webm";


                document.body.appendChild(a);

                a.click();

                a.remove();


                URL.revokeObjectURL(url);


                record.textContent=
                    "🎥 RECORD VIDEO";


                status.innerHTML=
                    "Status: <b>VIDEO READY</b><br>"+
                    "OrbitForge v0.7<br>"+
                    "Recording saved";

            };


        mediaRecorder.start();


        running=true;


        start.textContent=
            "⏸ PAUSE";


        record.textContent=
            "⏹ STOP RECORDING";


        status.innerHTML=
            "Status: <b>RECORDING</b><br>"+
            "OrbitForge v0.7<br>"+
            "Capturing 3D simulation...";

    }
);


updateValues();

init();

</script>

</body>
</html>
