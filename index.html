<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrbitForge v0.4</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02050b;
  color:white;
  font-family:system-ui,sans-serif;
}

#ui{
  position:fixed;
  z-index:10;
  left:12px;
  top:12px;
  width:calc(100% - 24px);
  max-width:390px;
  padding:15px;
  box-sizing:border-box;
  background:#071021ee;
  border:1px solid #38507c;
  border-radius:18px;
}

h1{
  margin:0;
  letter-spacing:3px;
}

.sub{
  color:#9daaca;
  font-size:12px;
  margin:3px 0 15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border-radius:11px;
  border:1px solid #42577f;
  background:#315fcb;
  color:white;
  font-size:16px;
}

#status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#091126;
  border:1px solid #22345b;
}
</style>
</head>

<body>

<div id="ui">

<h1>ORBITFORGE</h1>

<div class="sub">
Planetary Simulation Laboratory · v0.4 TEST
</div>

<button id="start">▶ START</button>

<button id="reset">↻ RESET</button>

<div id="status">
Status: READY<br>
Planet X: 5 AU<br>
Simulation: PAUSED
</div>

</div>

<script>

let running = false;
let orbit = 0;

const start = document.getElementById("start");
const reset = document.getElementById("reset");
const status = document.getElementById("status");

start.addEventListener("click", function(){

    running = !running;

    if(running){

        start.textContent = "⏸ PAUSE";

        status.innerHTML =
        "Status: <b>RUNNING</b><br>" +
        "Planet X: 5 AU<br>" +
        "Simulation: ACTIVE";

    }else{

        start.textContent = "▶ START";

        status.innerHTML =
        "Status: <b>PAUSED</b><br>" +
        "Planet X: 5 AU<br>" +
        "Simulation: PAUSED";

    }

});

reset.addEventListener("click", function(){

    running = false;
    orbit = 0;

    start.textContent = "▶ START";

    status.innerHTML =
    "Status: <b>READY</b><br>" +
    "Planet X: 5 AU<br>" +
    "Simulation: RESET";

});

setInterval(function(){

    if(running){

        orbit += 0.01;

    }

},50);

</script>

</body>
</html>
